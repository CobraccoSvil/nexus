[workspace]
members = [
  "crates/mcp-core",
  "crates/nexus-project-db",
  "crates/nexus-build-graph",
  "crates/nexus-tool-kit",
  "crates/nexus-agent-tools",
  "crates/nexus-wiki",
  "crates/mcp-token",
  "crates/mcp-ast",
  "crates/mcp-quality",
  "crates/mcp-db",
  "crates/mcp-proto",
  "crates/nexus-auth",
  "crates/nexus-types",
  "crates/nexus-cache",
  "crates/nexus-project-pools",
  "crates/admin-service",
  "crates/doc-service",
  "crates/plugin-service"
, "crates/nexus-orchestrator", "crates/ruvector", "crates/nexus-http", "crates/xtask", "crates/browser-bridge-mcp", "crates/nexus-events", "crates/nexus-sudo-runner", "crates/nexus-mcp-client", "crates/nexus-gateway", "crates/nexus-graph", "crates/nexus-graph-derive", "crates/nexus-agent-graph", "crates/nexus-pricing", "crates/nexus-ledger", "crates/nexus-model-eligibility", "crates/nexus-migrations-embedded", "crates/nexus-test-preconditions", "crates/nexus-service-catalog", "crates/nexus-migrations", "crates/nexus-prompt", "crates/nexus-capability-audit"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Cobracco S.r.l."]

# Profili build (bonifica dev-loop 2026-06-11). Portabili (versionati): il
# guadagno e' nel rebuild incrementale del dev-loop locale, senza toccare la
# correttezza ne il profilo release di produzione.
[profile.dev]
# Debuginfo minimale: solo tabelle di riga (basta per backtrace/panic con
# numero di riga). Genera e LINKA molto meno DWARF -> link incrementale piu'
# rapido. I debugger step-by-step perdono qualcosa, raro nel dev-loop di Nexus.
debug = "line-tables-only"
# NB: split-debuginfo="unpacked" RIMOSSO nel porting a Windows nativo: su MSVC
# non e' un valore supportato (solo "packed"/"off") e causava errore di build.
# Il default per piattaforma va bene: su Windows MSVC genera un .pdb separato.

# Le dipendenze esterne in dev: compilarle con un minimo di ottimizzazione le
# rende piu' veloci a runtime (es. sqlx/regex/serde) senza rallentare il
# rebuild del NOSTRO codice (le dep si compilano una volta sola e si cachano).
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws", "http2", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
prost = "0.13"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: serde_json::Value usa un IndexMap che conserva l'ordine
# d'inserimento/deserializzazione delle chiavi degli oggetti (invece dell'ordine
# alfabetico del BTreeMap). Serve a `nexus-agent-graph::py_json_dumps` per
# replicare 1:1 `json.dumps` di Python (che preserva l'ordine d'inserimento)
# sull'evidence dei criteri (es. http {url, method, status, ...} NON alfabetica).
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlparser = { version = "0.53", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
# Formattazione f64 shortest con tie-break round-half-to-EVEN, bit-identica al
# float.__repr__/json.dumps di CPython (la stdlib Rust usa round-half-away e
# diverge sui tie). Usato dal punto unico py_json (regola L) per la parita 1:1
# col brain delle signature anti-loop e dell'evidence del verifier.
ryu = "1.0"
urlencoding = "2"
base64 = "0.22"
dashmap = "5"
nexus-http = { path = "crates/nexus-http" }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
notify = { version = "6", features = ["serde"] }
# PTY cross-platform per il WebSocket del terminale IDE (mcp-core). Apre una
# shell reale (openpty) con resize/cwd/env; API SINCRONA, usata da un thread
# dedicato che ponta i bytes su un canale tokio (vedi project_workspace/terminal_ws.rs).
portable-pty = "0.9"
# Proc-macro per il derive del reducer di stato del grafo (nexus-graph-derive).
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[workspace.dependencies.tonic-build]
version = "0.12"

# Lint policy del workspace (post-rimozione del --cap-lints globale,
# bonifica 2026-06-11). I lint di CORRETTEZZA restano attivi e bloccanti
# via verify.sh (-D warnings); qui si silenziano SOLO le classi stilistiche
# del backlog storico, tracciate in docs/tech-debt-rust.md. Niente nuovi
# allow senza motivazione scritta.
[workspace.lints.clippy]
too_many_arguments = "allow"          # 16 firme storiche; refactor invasivo, backlog
type_complexity = "allow"             # 9 tipi axum/tuple storici, backlog
doc_overindented_list_items = "allow" # 38 doc-comment storici, solo formattazione
doc_lazy_continuation = "allow"       # liste numerate nei doc-comment, solo rendering
empty_line_after_doc_comments = "allow" # 5 casi, solo formattazione
