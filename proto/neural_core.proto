syntax = "proto3";

package ai_orchestrator.neural;

message EmbedTextRequest {
  string model = 1;
  string text = 2;
}

message EmbedBatchRequest {
  string model = 1;
  repeated string texts = 2;
}

message ClassifyIntentRequest {
  string project_id = 1;
  string profile_id = 2;
  string message = 3;
}

message RouteModelRequest {
  string project_id = 1;
  string profile_id = 2;
  string intent = 3;
  uint32 token_budget = 4;
}

message GenerateCompletionRequest {
  string provider = 1;
  string model = 2;
  string prompt = 3;
}

message GenerateStructuredCompletionRequest {
  string provider = 1;
  string model = 2;
  string prompt = 3;
  string json_schema = 4;
}

message GenerateAgentTurnRequest {
  string provider      = 1;
  string model         = 2;
  // JSON array [{role, content}] inclusi blocchi tool_use e tool_result
  string messages_json = 3;
  // JSON array di tool definitions nel formato Anthropic tool schema
  string tools_json    = 4;
  uint32 max_tokens    = 5;
  // System prompt separato (stringa di testo). Viene inviato come system message
  // nativo al provider (con cache_control su Anthropic) invece di essere incluso
  // nel primo messaggio user. Riduce drasticamente i token ripetuti ad ogni turno.
  string system_text   = 6;
}

message GenerateDocumentRequest {
  string doc_type = 1;
  string content_json = 2;
  string output_path = 3;
  string standard = 4;
  string title = 5;
  string project_name = 6;
}

message GenerateDocumentResponse {
  string file_path = 1;
  int32 page_count = 2;
  int32 section_count = 3;
  string error = 4;
}

message SyncKnowledgeBundleRequest {
  string provider = 1;
  string bundle_json = 2;
}

message ProviderHealthRequest {
  string provider = 1;
}

message ProviderModelsRequest {
  string provider = 1;
}

message JsonResponse {
  string json = 1;
}

// Classificazione errori provider: punto UNICO. Chiunque (anche mcp-core/Rust)
// chiama questo RPC invece di classificare per conto proprio. La risposta JSON
// contiene { error_class, message, retriable, backoff, http_status,
// retry_after_seconds } prodotti da brain/providers/error_handler.classify_error.
message ClassifyErrorRequest {
  string error_text = 1;
  string provider = 2;
}

service NeuralCoreService {
  rpc ClassifyError(ClassifyErrorRequest) returns (JsonResponse);
  rpc EmbedText(EmbedTextRequest) returns (JsonResponse);
  rpc EmbedBatch(EmbedBatchRequest) returns (JsonResponse);
  rpc ClassifyIntent(ClassifyIntentRequest) returns (JsonResponse);
  rpc RouteModel(RouteModelRequest) returns (JsonResponse);
  rpc GenerateCompletion(GenerateCompletionRequest) returns (JsonResponse);
  rpc GenerateStructuredCompletion(GenerateStructuredCompletionRequest) returns (JsonResponse);
  rpc ListProviderModels(ProviderModelsRequest) returns (JsonResponse);
  rpc SyncProviderModels(ProviderModelsRequest) returns (JsonResponse);
  rpc TestProviderConnection(ProviderHealthRequest) returns (JsonResponse);
  rpc SyncKnowledgeBundle(SyncKnowledgeBundleRequest) returns (JsonResponse);
  rpc GetProviderHealth(ProviderHealthRequest) returns (JsonResponse);
  rpc GenerateAgentTurn(GenerateAgentTurnRequest) returns (JsonResponse);
  rpc GenerateDocument(GenerateDocumentRequest) returns (GenerateDocumentResponse);
}

