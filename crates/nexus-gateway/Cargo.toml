[package]
name = "nexus-gateway"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# Il crate e' sia LIBRERIA (moduli Fase 0-4 riusati da mcp-core) sia BINARIO
# (server della Fase 5). Il binario NON viene avviato in produzione finche' la
# parita' col gateway Node non e' validata (Fase 6): qui si compila e si testa.
[lib]
name = "nexus_gateway"
path = "src/lib.rs"

[[bin]]
name = "nexus-gateway"
path = "src/bin/server.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
dashmap.workspace = true
futures.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
regex.workspace = true
dotenvy.workspace = true
tower.workspace = true
tower-http.workspace = true
async-trait = "0.1"
serde_yaml = "0.9"
thiserror = "1.0"
# Decodifica dell'audio base64 (TranscribeRequest) prima dell'invio multipart al
# provider; usata anche nei test di gcp_auth (header/payload JWT, senza rete).
base64.workspace = true
nexus-cache = { path = "../nexus-cache" }
nexus-auth = { path = "../nexus-auth" }
nexus-pricing = { path = "../nexus-pricing" }
# Punto unico della contabilita' di ai_usage_ledger (regola L): qui restano solo
# gli adapter dai tipi del gateway (identita' e token da LlmRequest/LlmResponse).
nexus-ledger = { path = "../nexus-ledger" }
# Punto unico del secret scanner su stringa (redazione prompt/output, regola L).
nexus-tool-kit = { path = "../nexus-tool-kit" }
# Punto unico della PRESENTAZIONE degli errori (error_presentation): il gateway
# e' l'ultimo posto dove status, codice strutturato, provider e modello sono
# ancora VIVI, quindi e' qui che la frase per l'utente deve nascere. Nessun ciclo:
# nexus-gateway non e' dipendenza di nexus-types (ne' di alcun altro crate).
nexus-types = { path = "../nexus-types" }

[dev-dependencies]
# Schema META (`db/migrations`) per i `#[sqlx::test]` della scrittura di ledger:
# il test deve rileggere le colonne DAL database vero, non da una fixture
# ricopiata, altrimenti non puo' dimostrare che il valore bindato in posizione N
# finisce nella colonna N (regola O). Vedi crates/nexus-migrations-embedded.
nexus-migrations-embedded = { path = "../nexus-migrations-embedded" }
