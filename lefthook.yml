# lefthook.yml — hook git gestiti da lefthook.

# Installazione:
#   pnpm add -D -w lefthook
#   pnpm exec lefthook install

# Pre-commit veloce: turbo typecheck/lint + cargo check.
# Suite completa via script verify e CI.

# Emergenza: LEFTHOOK=0

# Fail-closed della risoluzione di lefthook. L'hook generato, se non trova il proprio
# binario, stampa "Can't find lefthook in PATH" e ritorna 0: il commit passa con tutti i
# gate saltati (falso verde). Nei worktree succedeva sempre, perche' il template cerca
# node_modules sotto la root del worktree, dove non esiste. Questa chiave fa includere
# .lefthookrc dentro l'hook rigenerato: li' lefthook viene risolto anche dai worktree e,
# se manca, il commit viene RIFIUTATO. Va qui e non in .git/hooks perche' gli hook sono
# rigenerati da 'lefthook install'; lefthook.yml e .lefthookrc sono invece versionati.
# NB il prefisso './' e' obbligatorio: il valore finisce testuale nell'hook come
# '. <valore>', e il comando '.' di POSIX sh cerca nel PATH (non nella cwd) quando
# l'argomento non contiene una slash. Con 'rc: .lefthookrc' il source fallisce sempre
# con "file not found" anche se il file c'e'.
rc: ./.lefthookrc

# NB Windows: lefthook word-splitta il campo 'run' ignorando le virgolette, quindi
# 'bash -lc "comando con spazi"' veniva eseguito come 'bash -lc comando con spazi'
# (bash riceveva come command string solo il primo token -> falso-verde). Per i
# comandi non banali si invoca SEMPRE uno script dedicato in scripts/ con due soli
# token ('bash scripts/<nome>.sh'); cosi' nessuna interpolazione li corrompe.
# Pattern di riferimento: commit-msg no-emoji -> scripts/check-no-emoji.sh.

pre-commit:
  parallel: false
  commands:
    # Premessa di TUTTI i gate sotto: che stiano misurando l'albero che sta
    # committando. Gli hook sono condivisi fra repo principale e worktree
    # (core.hooksPath punta a <main>/.git/hooks), quindi quella premessa non e'
    # garantita da nulla di dichiarato -- e se cade i gate restano verdi mentre
    # misurano l'altro albero. 'priority: 1' lo fa girare per primo (v1.13.6
    # esegue i comandi in ordine alfabetico quando priority non c'e': verificato);
    # nessun glob, cosi' copre anche i gate futuri con altri glob. Costo: due
    # 'git rev-parse'. Perche' il confronto non e' tautologico: nello script.
    hook_tree_guard:
      priority: 1
      run: bash scripts/check-hook-tree.sh
      fail_text: "pre-commit: i gate non girano nell'albero che sta committando."

    # Fine-riga dichiarati vs materializzati: un file 'eol=lf' che sul disco ha
    # CRLF non e' visibile a 'git diff' ne', sul repo reale, a 'git status' —
    # ma i suoi byte sono altri, e per le migrazioni i byte sono il checksum in
    # '_sqlx_migrations'. Senza glob e senza dipendere dai file staged: il
    # difetto non sta nel commit, sta nell'albero, e questo e' l'unico momento
    # in cui qualcuno lo guarda. Costo 0,75s (misurato): i candidati sono i soli
    # pattern che .gitattributes dichiara eol=lf, non l'albero intero (20s).
    eol_guard:
      priority: 2
      run: bash scripts/check-eol.sh
      fail_text: "pre-commit: un file dichiarato eol=lf e' materializzato CRLF. Ri-materializzalo (il messaggio sopra ha i comandi)."

    # fail_text: NON afferma una causa, e non e' pigrizia. Questo testo e'
    # statico per costruzione — lefthook lo stampa senza vedere l'esito del
    # comando — quindi non puo' sapere se il gate ha bocciato il codice o se non
    # e' mai partito. Un testo statico che afferma "correggi typecheck/lint"
    # sbaglia esattamente nel caso in cui l'utente ha piu' bisogno di leggere il
    # vero (misurato l'08/08/2026: worktree senza node_modules, gate mai
    # eseguito, sessione mandata a cercare un difetto nel proprio TypeScript).
    # La causa la compone chi la conosce, cioe' lo script (gate-premesse.sh).
    turbo_quick:
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
      run: bash scripts/precommit-turbo.sh
      fail_text: "pre-commit turbo: non superato. La causa e' nel messaggio sopra (questo testo e' statico e non la conosce)."

    # Solo sorgenti Rust e manifest cargo: nessun file *.yaml/*.yml e' input di
    # 'cargo check' (verificato: niente include_str! di yaml, build.rs leggono solo
    # .proto). Il glob yaml/yml ereditato dallo scaffold iniziale faceva girare un
    # cargo check dell'intero workspace a ogni commit di config (es. questo stesso
    # lefthook.yml): 10+ minuti inutili che spingono verso --no-verify (vietato, C).
    # Dal 2026-08-05 esegue `cargo clippy --all-targets -- -D warnings`, lo
    # STESSO comando di `pnpm verify`, non piu' `cargo check`: i due non
    # condividono gli artefatti (clippy imposta RUSTC_WORKSPACE_WRAPPER, che
    # cambia il fingerprint dei crate del workspace), quindi con comandi diversi
    # questo hook ricompilava tutto anche subito dopo un gate verde. Il nome
    # della voce resta per non spezzare gli hook gia' installati.
    cargo_check_quick:
      glob:
        - "*.rs"
        - "*.toml"
      # fail_text neutro per la stessa ragione di turbo_quick: qui il caso
      # misurato era il .env assente nel worktree, e questo testo diceva
      # "correggi gli errori/warning clippy" dopo 2,4s, senza che nulla fosse
      # stato compilato. Lo script distingue ora i due esiti nel codice d'uscita
      # (78 = non eseguito, 1 = clippy ha bocciato) e ne compone il testo.
      run: bash scripts/precommit-cargo-check.sh
      fail_text: "pre-commit cargo: non superato. La causa e' nel messaggio sopra (questo testo e' statico e non la conosce)."

    # Gate ratchet qualita (scripts/quality-baseline.json): ~2-8s a target caldo.
    # Sta qui e non solo in `pnpm verify`/CI perche' e' un gate GLOBALE: chi lo
    # esegue paga il debito di tutti. Confinato alla verifica completa, il drift
    # si accumulava invisibile per decine di commit e ricadeva sul primo che
    # eseguiva `pnpm verify` (misurato: 92 commit, +812 finding). Ora lo vede chi
    # lo introduce, quando correggerlo costa poco.
    quality_scan:
      glob:
        - "*.rs"
      run: bash scripts/precommit-quality-scan.sh
      fail_text: "pre-commit: regressione qualita (gate ratchet). Riduci le violazioni introdotte; aggiorna la baseline SOLO se il peggioramento e' giustificato, e dichiaralo nel commit."

    # Guard dei punti unici (regola L / ADR 0026): grep istantaneo, blocca nuove
    # definizioni di un punto unico fuori dal suo modulo. Il gate jscpd "ratchet"
    # completo gira in CI (verify.yml), non a ogni commit per non rallentarlo.
    single_source_guard:
      glob:
        - "*.rs"
        - "*.ts"
        - "*.tsx"
      run: bash scripts/check-single-source.sh
      fail_text: "pre-commit: regressione su un punto unico (regola L / ADR 0026)."

    # Gate ratchet dei marker di debito e delle frasi di inerzia
    # (scripts/markers-baseline.json): grep istantaneo. Il conteggio puo' solo
    # SCENDERE — nessun commit aggiunge un TODO/FIXME/INERTE netto. Come gli altri
    # gate globali, lo vede chi lo introduce, non chi esegue `pnpm verify` dopo.
    markers_ratchet:
      glob:
        - "*.rs"
        - "*.ts"
        - "*.tsx"
      run: bash scripts/markers-ratchet.sh
      fail_text: "pre-commit: un marker di debito o una frase di inerzia in piu' della baseline. Rimuovilo, o aggiorna markers-baseline.json se giustificato (dichiaralo nel commit)."

commit-msg:
  commands:
    # Check estratto in scripts/check-no-emoji.sh: la regex \x{...} inline veniva
    # corrotta dall'interpolazione dei template lefthook su Windows e grep -P non e'
    # supportato da Git Bash. Lo script usa node (match Unicode indipendente dal locale).
    no-emoji:
      run: bash scripts/check-no-emoji.sh "{1}"

# Nessun hook post-commit: la notifica meta-vault per commit
# (POST /api/meta-docs/ingest-commit) e' stata ritirata con ADR 0017 v2 —
# l'endpoint risponde 410 Gone. Il vault e' ingerito dal watcher filesystem
# (crates/nexus-wiki/src/watcher.rs) e dal reingest (POST /api/wiki/reingest).
