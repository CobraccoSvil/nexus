name: Verify

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.7.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm verify
        run: pnpm verify

      - name: Guard punti unici (regola L)
        run: bash scripts/check-single-source.sh

      - name: Gate ratchet duplicazione (jscpd)
        run: bash scripts/dup-report.sh

      - name: Lint commits (xtask)
        run: pnpm xtask lint-commits origin/main HEAD || true
