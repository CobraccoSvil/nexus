# lefthook.yml — hook git gestiti da lefthook.

# Installazione:
#   pnpm add -D -w lefthook
#   pnpm exec lefthook install

# Pre-commit veloce: turbo typecheck/lint + cargo check.
# Suite completa via script verify e CI.

# Emergenza: LEFTHOOK=0

# Fail-closed della risoluzione di lefthook. L'hook generato, se non trova il proprio
# binario, stampa "Can't find lefthook in PATH" e ritorna 0: il commit passa con tutti i
# gate saltati (falso verde). Nei worktree succedeva sempre, perche' il template cerca
# node_modules sotto la root del worktree, dove non esiste. Questa chiave fa includere
# .lefthookrc dentro l'hook rigenerato: li' lefthook viene risolto anche dai worktree e,
# se manca, il commit viene RIFIUTATO. Va qui e non in .git/hooks perche' gli hook sono
# rigenerati da 'lefthook install'; lefthook.yml e .lefthookrc sono invece versionati.
# NB il prefisso './' e' obbligatorio: il valore finisce testuale nell'hook come
# '. <valore>', e il comando '.' di POSIX sh cerca nel PATH (non nella cwd) quando
# l'argomento non contiene una slash. Con 'rc: .lefthookrc' il source fallisce sempre
# con "file not found" anche se il file c'e'.
rc: ./.lefthookrc

# NB Windows: lefthook word-splitta il campo 'run' ignorando le virgolette, quindi
# 'bash -lc "comando con spazi"' veniva eseguito come 'bash -lc comando con spazi'
# (bash riceveva come command string solo il primo token -> falso-verde). Per i
# comandi non banali si invoca SEMPRE uno script dedicato in scripts/ con due soli
# token ('bash scripts/<nome>.sh'); cosi' nessuna interpolazione li corrompe.
# Pattern di riferimento: commit-msg no-emoji -> scripts/check-no-emoji.sh.

pre-commit:
  parallel: false
  commands:
    turbo_quick:
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
      run: bash scripts/precommit-turbo.sh
      fail_text: "pre-commit turbo fallito: correggi typecheck/lint."

    # Solo sorgenti Rust e manifest cargo: nessun file *.yaml/*.yml e' input di
    # 'cargo check' (verificato: niente include_str! di yaml, build.rs leggono solo
    # .proto). Il glob yaml/yml ereditato dallo scaffold iniziale faceva girare un
    # cargo check dell'intero workspace a ogni commit di config (es. questo stesso
    # lefthook.yml): 10+ minuti inutili che spingono verso --no-verify (vietato, C).
    cargo_check_quick:
      glob:
        - "*.rs"
        - "*.toml"
      run: bash scripts/precommit-cargo-check.sh
      fail_text: "pre-commit cargo fallito: correggi cargo check."

    # Gate ratchet qualita (scripts/quality-baseline.json): ~2-8s a target caldo.
    # Sta qui e non solo in `pnpm verify`/CI perche' e' un gate GLOBALE: chi lo
    # esegue paga il debito di tutti. Confinato alla verifica completa, il drift
    # si accumulava invisibile per decine di commit e ricadeva sul primo che
    # eseguiva `pnpm verify` (misurato: 92 commit, +812 finding). Ora lo vede chi
    # lo introduce, quando correggerlo costa poco.
    quality_scan:
      glob:
        - "*.rs"
      run: bash scripts/precommit-quality-scan.sh
      fail_text: "pre-commit: regressione qualita (gate ratchet). Riduci le violazioni introdotte; aggiorna la baseline SOLO se il peggioramento e' giustificato, e dichiaralo nel commit."

    # Guard dei punti unici (regola L / ADR 0026): grep istantaneo, blocca nuove
    # definizioni di un punto unico fuori dal suo modulo. Il gate jscpd "ratchet"
    # completo gira in CI (verify.yml), non a ogni commit per non rallentarlo.
    single_source_guard:
      glob:
        - "*.rs"
        - "*.ts"
        - "*.tsx"
      run: bash scripts/check-single-source.sh
      fail_text: "pre-commit: regressione su un punto unico (regola L / ADR 0026)."

commit-msg:
  commands:
    # Check estratto in scripts/check-no-emoji.sh: la regex \x{...} inline veniva
    # corrotta dall'interpolazione dei template lefthook su Windows e grep -P non e'
    # supportato da Git Bash. Lo script usa node (match Unicode indipendente dal locale).
    no-emoji:
      run: bash scripts/check-no-emoji.sh "{1}"

# Nessun hook post-commit: la notifica meta-vault per commit
# (POST /api/meta-docs/ingest-commit) e' stata ritirata con ADR 0017 v2 —
# l'endpoint risponde 410 Gone. Il vault e' ingerito dal watcher filesystem
# (crates/nexus-wiki/src/watcher.rs) e dal reingest (POST /api/wiki/reingest).
