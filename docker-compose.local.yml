# Stack Docker per sviluppo locale in WSL.
# Avvio: docker compose -f docker-compose.local.yml up -d

services:
  postgres-nexus:
    image: pgvector/pgvector:pg17
    # pg_stat_statements: telemetria query (calls, mean_exec_time) per
    # diagnosi performance. Richiede preload all'avvio del server; la
    # CREATE EXTENSION e' una tantum nel DB nexus.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5433:5432"
    volumes:
      - postgres-nexus-data:/var/lib/postgresql/data
      - ./infra/sql/init-schemas.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./infra/sql/rls-policies.sql:/docker-entrypoint-initdb.d/02-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # M74 — Container Postgres SEPARATO per i DB applicativi generati dall'agente.
  # Isolato fisicamente dal container postgres-nexus: anche se l'agente riesce
  # a connettersi non puo' MAI raggiungere il DB Nexus (sono cluster diversi).
  # Il role applicativo `nexus_app` viene creato dal bootstrap SQL con permessi
  # minimali (NOSUPERUSER, NOCREATEROLE) — vedi infra/sql/init-postgres-app.sql.
  postgres-app:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_admin_secret
      POSTGRES_DB: postgres
      # Password del role applicativo letta dal bootstrap script. In dev usiamo
      # un valore fisso; in prod sovrascrivere via env del compose.
      NEXUS_APP_DB_PASSWORD: nexus_app_dev_secret
    ports:
      - "5434:5432"
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
      - ./infra/sql/init-postgres-app.sh:/docker-entrypoint-initdb.d/01-bootstrap-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/docker/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: "9411"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-nexus-data:
  postgres-app-data:
  qdrant-data:
  grafana-data:
