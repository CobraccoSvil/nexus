name: Verify

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    # `cargo test --workspace` (dentro pnpm verify) include test #[sqlx::test]
    # (model_selection, orchestrator, allocate_port, agent_run) che creano DB
    # temporanei: servono un Postgres e DATABASE_URL, come nel job lint-test-build
    # di ci.yml. Senza, quei test falliscono e il job verify resta rosso.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        # v4 (runtime Node 20): le @v2 usavano Node 16, dismesso da GitHub ->
        # hard-fail del job all'avvio. La versione pnpm e' letta da package.json
        # "packageManager" (pnpm@10.7.0): NON aggiungere `version:` o v4 aborta
        # con "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Il crate mcp-proto usa prost-build, che richiede il compilatore protobuf
      # `protoc` a build time. Senza, `cargo check/clippy/test` (dentro pnpm
      # verify) fallisce subito con "Could not find protoc". ci.yml non ne ha
      # bisogno perche' non compila Rust.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run pnpm verify
        # Il pytest del brain e' coperto dal job dedicato `brain-tests` (che
        # installa torch + le deps Python). Questo job NON le installa, quindi la
        # fase Python di verify.sh va saltata: senza skip, `python3 -m pytest`
        # fallisce con ModuleNotFoundError nel job verify (gate JS+Rust).
        run: pnpm verify
        env:
          VERIFY_SKIP_PY: "1"

      - name: Guard punti unici (regola L)
        run: bash scripts/check-single-source.sh

      - name: Gate ratchet duplicazione (jscpd)
        run: bash scripts/dup-report.sh

      - name: Lint commits (xtask)
        run: pnpm xtask lint-commits origin/main HEAD || true

  # Suite pytest del brain Python. Job separato (parallelo a verify): la suite
  # e' auto-contenuta (mock puri, nessun Postgres/Qdrant richiesto). Gate nato
  # dall'audit 11/06/2026: 9 test marciti perche' pnpm verify non li copriva.
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch arriva come dipendenza transitiva di sentence-transformers: il
      # wheel CPU pesa una frazione di quello CUDA di default (inutile in CI).
      - name: Install torch CPU
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Fonte unica dipendenze: brain/pyproject.toml (build backend poetry-core).
      # pytest/pytest-asyncio sono nel gruppo dev poetry, che pip non installa.
      - name: Install brain dependencies
        run: pip install ./brain pytest pytest-asyncio

      - name: Pytest brain
        run: python -m pytest -o addopts="" brain/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}
