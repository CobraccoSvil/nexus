[tool.poetry]
name = "ai-orchestrator-brain"
version = "0.1.0"
description = "Neural core for AI-Orchestrator v2"
authors = ["Cobracco S.r.l."]
# La directory `brain/` ha gia' un `__init__.py` ed e' essa stessa il package.
# Il vecchio `include = "brain"` faceva cercare a poetry-core `brain/brain/`
# (inesistente) -> wheel build failed. Con `from = ".."` poetry cerca da una
# dir sopra, trovando `../brain/` cioe' la dir corrente. Fix Bug B (27/05/2026).
packages = [{ include = "brain", from = ".." }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = "^2.11.2"
httpx = "^0.28.1"
grpcio = "^1.68"
grpcio-tools = "^1.68"
protobuf = "^5.29"
sentence-transformers = "^3.3"
qdrant-client = "^1.12"
openai = "^1.58"
anthropic = "^0.40"
google-generativeai = "^0.8"
numpy = "^2.0"
tiktoken = "^0.8"
python-docx = "^1.1"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
aiosqlite = ">=0.19.0"
typing-extensions = ">=4.12"
asyncpg = ">=0.31.0"
sqlalchemy = {version = ">=2.0", extras = ["asyncio"]}
# Driver sincrono usato dai punti unici settings_db/db_pool e da 20+ moduli
# (criteria_runner, todo_store, ...). Era installato solo a mano sul dev box:
# senza questa riga un install dal pyproject (CI inclusa) non lo porta.
psycopg2-binary = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
mypy = "^1.11"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# --- Regole dogfood direttive Nexus ---

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["brain/__pycache__", "brain/grpc_server/.*_pb2.*\\.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["brain/grpc_server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=brain --cov-report=term --cov-fail-under=60"
testpaths = ["tests"]
asyncio_mode = "auto"
