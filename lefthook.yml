# lefthook.yml — hook git gestiti da lefthook.

# Installazione:
#   pnpm add -D -w lefthook
#   pnpm exec lefthook install

# Pre-commit veloce: turbo typecheck/lint + cargo check.
# Suite completa via script verify e CI.

# Emergenza: LEFTHOOK=0

# NB Windows: lefthook word-splitta il campo 'run' ignorando le virgolette, quindi
# 'bash -lc "comando con spazi"' veniva eseguito come 'bash -lc comando con spazi'
# (bash riceveva come command string solo il primo token -> falso-verde). Per i
# comandi non banali si invoca SEMPRE uno script dedicato in scripts/ con due soli
# token ('bash scripts/<nome>.sh'); cosi' nessuna interpolazione li corrompe.
# Pattern di riferimento: commit-msg no-emoji -> scripts/check-no-emoji.sh.

pre-commit:
  parallel: false
  commands:
    turbo_quick:
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
      run: bash scripts/precommit-turbo.sh
      fail_text: "pre-commit turbo fallito: correggi typecheck/lint."

    # Solo sorgenti Rust e manifest cargo: nessun file *.yaml/*.yml e' input di
    # 'cargo check' (verificato: niente include_str! di yaml, build.rs leggono solo
    # .proto). Il glob yaml/yml ereditato dallo scaffold iniziale faceva girare un
    # cargo check dell'intero workspace a ogni commit di config (es. questo stesso
    # lefthook.yml): 10+ minuti inutili che spingono verso --no-verify (vietato, C).
    cargo_check_quick:
      glob:
        - "*.rs"
        - "*.toml"
      run: bash scripts/precommit-cargo-check.sh
      fail_text: "pre-commit cargo fallito: correggi cargo check."

    # Guard dei punti unici (regola L / ADR 0026): grep istantaneo, blocca nuove
    # definizioni di un punto unico fuori dal suo modulo. Il gate jscpd "ratchet"
    # completo gira in CI (verify.yml), non a ogni commit per non rallentarlo.
    single_source_guard:
      glob:
        - "*.rs"
        - "*.ts"
        - "*.tsx"
      run: bash scripts/check-single-source.sh
      fail_text: "pre-commit: regressione su un punto unico (regola L / ADR 0026)."

commit-msg:
  commands:
    # Check estratto in scripts/check-no-emoji.sh: la regex \x{...} inline veniva
    # corrotta dall'interpolazione dei template lefthook su Windows e grep -P non e'
    # supportato da Git Bash. Lo script usa node (match Unicode indipendente dal locale).
    no-emoji:
      run: bash scripts/check-no-emoji.sh "{1}"

# Post-commit: notifica mcp-core per aggiornare il meta-vault.
# Fail-soft: se mcp-core non e' raggiungibile (dev offline), il commit passa
# comunque e il MetaDocsRefreshWorker recupera al prossimo tick periodico.
post-commit:
  parallel: false
  commands:
    meta_docs_ingest:
      run: bash scripts/postcommit-meta-docs.sh
      fail_text: ""
