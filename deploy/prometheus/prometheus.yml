global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "nexus-mcp-core"
    metrics_path: /nexus/metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          service: mcp-core
          component: nexus-orchestrator

  - job_name: "web-ide"
    static_configs:
      - targets: ["host.docker.internal:3000"]

