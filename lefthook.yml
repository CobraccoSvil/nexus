# lefthook.yml — hook git gestiti da lefthook.

# Installazione:
#   pnpm add -D -w lefthook
#   pnpm exec lefthook install

# Pre-commit veloce: turbo typecheck/lint + cargo check.
# Suite completa via script verify e CI.

# Emergenza: LEFTHOOK=0

pre-commit:
  parallel: false
  commands:
    turbo_quick:
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
      # Niente wrapper `bash -lc "..."`: su git-bash Windows lefthook non
      # preserva la stringa quotata (esegue solo il primo token). Lasciare il
      # comando nudo: lefthook lo passa al suo shell (sh -c) integro.
      run: pnpm exec turbo run typecheck lint --continue
      fail_text: "pre-commit turbo fallito: correggi typecheck/lint."

    cargo_check_quick:
      glob:
        - "*.rs"
        - "*.toml"
        - "*.yaml"
        - "*.yml"
      run: cargo check --workspace
      fail_text: "pre-commit cargo fallito: correggi cargo check."

    # Guard dei punti unici (regola L / ADR 0026): grep istantaneo, blocca nuove
    # definizioni di un punto unico fuori dal suo modulo. Il gate jscpd "ratchet"
    # completo gira in CI (verify.yml), non a ogni commit per non rallentarlo.
    single_source_guard:
      glob:
        - "*.rs"
        - "*.ts"
        - "*.tsx"
      run: bash scripts/check-single-source.sh
      fail_text: "pre-commit: regressione su un punto unico (regola L / ADR 0026)."

commit-msg:
  commands:
    no-emoji:
      # Logica in scripts/check-no-emoji.sh (regola L): forma single-line +
      # LC_ALL=C.UTF-8, portabile su git-bash Windows dove il blocco `run: |`
      # multi-line e `grep -P` con locale non-UTF-8 fallivano.
      run: bash scripts/check-no-emoji.sh "{1}"

# Post-commit: notifica mcp-core per aggiornare il meta-vault.
# Fail-soft: se mcp-core non e' raggiungibile (dev offline), il commit passa
# comunque e il MetaDocsRefreshWorker recupera al prossimo tick periodico.
post-commit:
  parallel: false
  commands:
    meta_docs_ingest:
      # Logica in scripts/meta-docs-ingest.sh (regola L): il blocco `run: |`
      # multi-line non sopravvive a lefthook su git-bash Windows.
      run: bash scripts/meta-docs-ingest.sh
      fail_text: ""
