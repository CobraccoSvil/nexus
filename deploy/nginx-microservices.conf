# Nginx configuration for IDEAI microservices gateway
# Place in /etc/nginx/sites-available/ideai and symlink to sites-enabled
#
# Architecture:
#   Core Platform     :4000  — projects, workspace, auth, vector_memory
#   Admin Service     :4010  — users, projects admin, settings, templates
#   Chat Service      :4020  — chat sessions/messages, agent, profiles
#   Doc Service       :4030  — documents CRUD, generation, vectorization
#   Plugin Service    :4050  — plugins, MCP connectors, tool execution
#   Web IDE           :3000  — Next.js frontend

upstream core_platform   { server 127.0.0.1:4000; }
upstream admin_service   { server 127.0.0.1:4010; }
upstream chat_service    { server 127.0.0.1:4020; }
upstream doc_service     { server 127.0.0.1:4030; }
upstream plugin_service  { server 127.0.0.1:4050; }
upstream web_ide         { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name _;

    # Timeouts for SSE streaming
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Admin Service (:4010) ---
    location /api/admin/ {
        proxy_pass http://admin_service;
    }
    location /api/prompt-templates {
        proxy_pass http://admin_service;
    }
    location /api/quality/ {
        proxy_pass http://admin_service;
    }

    # --- Chat & Agent Service (:4020) ---
    location /api/chat/ {
        proxy_pass http://chat_service;
        # SSE support for agent-stream
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
    location /api/profiles {
        proxy_pass http://chat_service;
    }
    location /api/memories/ {
        proxy_pass http://chat_service;
    }

    # --- Document Service (:4030 non attivo) — gestito da core_platform :4000 ---
    location ~ ^/api/projects/[^/]+/documents {
        proxy_pass http://core_platform;
    }
    location /api/documents/ {
        proxy_pass http://core_platform;
    }

    # --- Billing (billing-service RIMOSSO) — implementato in core_platform :4000 ---
    location /api/billing/ {
        proxy_pass http://core_platform;
    }

    # --- Plugin & MCP Service (:4050 non attivo) — gestito da core_platform :4000 ---
    # NOTA: plugin_service (4050) e doc_service (4030) non ancora attivi.
    # Tutte le loro route sono implementate in mcp-core (porta 4000).
    location /api/plugins {
        proxy_pass http://core_platform;
    }
    location /api/plugin-catalog {
        proxy_pass http://core_platform;
    }
    location /api/mcp-servers {
        proxy_pass http://core_platform;
    }
    location /auth/figma/ {
        proxy_pass http://core_platform;
    }

    # --- Internal routes (only from localhost) ---
    location /internal/ {
        # Restrict to internal network
        allow 127.0.0.1;
        allow 192.168.0.0/24;
        deny all;

        # Route to appropriate service based on path
        location /internal/mcp/ {
            proxy_pass http://core_platform;
        }
        location /internal/settings/ {
            proxy_pass http://core_platform;
        }
    }

    # --- Core Platform (:4000) — fallback for projects, workspace, auth ---
    location /api/ {
        proxy_pass http://core_platform;
    }
    location /auth/ {
        proxy_pass http://core_platform;
    }
    location /health {
        proxy_pass http://core_platform;
    }

    # --- Web IDE frontend ---
    location / {
        proxy_pass http://web_ide;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
