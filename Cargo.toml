[workspace]
members = [
  "crates/mcp-core",
  "crates/mcp-token",
  "crates/mcp-ast",
  "crates/mcp-quality",
  "crates/mcp-db",
  "crates/mcp-comments",
  "crates/mcp-learning",
  "crates/mcp-proto",
  "crates/nexus-auth",
  "crates/nexus-types",
  "crates/admin-service",
  "crates/billing-service",
  "crates/doc-service",
  "crates/chat-service",
  "crates/plugin-service"
, "crates/nexus-orchestrator", "crates/ruvector", "crates/nexus-http", "crates/xtask", "crates/browser-bridge-mcp"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Cobracco S.r.l."]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws", "http2", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
prost = "0.13"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.53", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.44", features = ["full"] }
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
base64 = "0.22"
dashmap = "5"
nexus-http = { path = "crates/nexus-http" }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[workspace.dependencies.tonic-build]
version = "0.12"
