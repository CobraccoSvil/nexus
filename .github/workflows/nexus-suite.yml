name: nexus-suite

# PR-4 — Test suite Plan/Act/Verify + Sub-agents.
#
# Livello 3 (contract Rust) eseguito su ogni PR.
# Livello 6 (UI Playwright) eseguito in nightly schedule.

on:
  pull_request:
    paths:
      - "crates/mcp-core/**"
      - "apps/web-ide/**"
      - "tests/**"
      - "db/migrations/**"
      - "infra/sql/**"
  workflow_dispatch:
  schedule:
    # Settimanale e non piu' notturno: su account Free 2000 minuti/mese non
    # reggono un nightly per workflow. Il livello 6 (Playwright) resta
    # comunque lanciabile a mano con workflow_dispatch quando serve.
    - cron: "0 3 * * 1"   # lunedi 03:00 UTC

jobs:
  contract-rust:
    name: "L3 contract test Rust"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5433/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Il ciclo precedente era `psql -f "$f" || true`: applicava i file uno per
      # uno e buttava via OGNI errore, quindi un set che non si applica lasciava
      # il job verde su uno schema parziale. Sostituito, non rimosso: senza uno
      # step di migrazione questo job girerebbe su uno schema ASSENTE, che e'
      # peggio di uno parziale.
      - name: Apply migrations
        run: cargo run --locked -p xtask -- migrate --set meta --apply
      - name: cargo test contract
        run: cargo test -p mcp-core --tests --release -- --nocapture

  ui-playwright:
    name: "L6 UI e2e Playwright"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      # pnpm PRIMA di setup-node, e non e' cosmetica: con `cache: pnpm` l'action
      # di Node cerca l'eseguibile pnpm per calcolare la chiave di cache, e se
      # non c'e' ancora muore con "Unable to locate executable file: pnpm".
      # E' esattamente cio' che accadeva: questo job e' rosso su OGNI run e non
      # ha mai eseguito un test Playwright — moriva prima, nello step di setup.
      # Un gate che sembra esistere e non ha mai misurato niente.
      #
      # @v4 senza `version:`: la versione di pnpm la dichiara "packageManager"
      # in package.json (punto unico), come gia' in verify.yml.
      - uses: pnpm/action-setup@v4
      # Versione di Node dal punto unico .nvmrc, come in verify.yml: qui c'era lo
      # stesso "20" scritto a mano, e questo job esegue la web-ide, i cui test
      # sono file .ts che sotto Node 22.18 non partono affatto.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui-e2e
        continue-on-error: true
        env:
          WEB_IDE_URL: http://localhost:3000
