# Profilo CLOUD — provider esterni, no on-premise
#
# ── Come leggere la matrice tier -> provider ─────────────────────────────────
# Il policy engine (crates/nexus-gateway/src/policy_engine.rs) classifica ogni
# richiesta con un sensitivity tier EFFETTIVO = max(tier dichiarato dal caller,
# tier rilevato dal classifier su segreti/PII nella history). Il tier effettivo
# seleziona la chain `routing.tier_N` (primary -> secondary -> tertiary ->
# fallback) dei provider ammessi.
#
# Gate cloud per-tier (flag `features.allow_cloud_tier2/3`, override runtime
# dai settings DB `dlp_allow_cloud_tier2/3` — regola G, cache 60s):
#   - flag a false => i provider CLOUD (anthropic/openai/mistral/deepseek/
#     google) sono ESCLUSI dal tier, restano solo i locali (vllm);
#   - `dlp_enabled=false` => ogni richiesta e' trattata come tier 0.
#
# Pin del provider (`pin_provider` nella richiesta, usato dal motore agentico):
# bypassa il ROUTING di questa matrice ma NON il gate cloud per-tier: se il
# tier effettivo vieta il cloud e il pin e' un provider cloud, il gateway
# risponde 403 `POLICY_TIER_EXCLUDED` (vedi sotto) invece di inviare il
# contenuto riservato al cloud. La redazione (segreti/PII) resta attiva in
# entrambi i path per tier >= 2 (strict mode).
#
# Codici d'errore STRUTTURATI del gateway verso i caller (regola M — decidere
# dai codici/details, mai dal testo umano):
#   - `POLICY_TIER_EXCLUDED` (403): provider escluso dalla policy per il
#     sensitivity tier del contenuto; `details` porta `detected_tier`,
#     `provider` (se pinnato) e `allowed_providers`.
#   - `TIER_BLOCKED` (403): routing bloccato per motivi non-DLP (tier ignoto,
#     flag tenant).
#   - `PROVIDER_ERROR` (500): tutti i provider della chain hanno fallito;
#     `details.failures[]` porta la classe per-provider (`billing` |
#     `client_error` | `transient` | `cooldown` | `cooldown_billing`) +
#     status/code HTTP del provider; `details.primary_cause` e' la classe del
#     primo fallimento. Un `client_error` (4xx del provider) NON e' un
#     cooldown: il motore lo racconta come rifiuto della richiesta.
profile: cloud

providers:
  openai:
    enabled: true
    timeout_ms: 30000
  mistral:
    enabled: true
    timeout_ms: 30000
  deepseek:
    enabled: true
    timeout_ms: 30000
  google:
    enabled: true
    timeout_ms: 30000
  groq:
    enabled: true
    timeout_ms: 30000
  openrouter:
    enabled: true
    timeout_ms: 30000

redaction:
  enabled: true
  strict_mode: false
  presidio_grpc_url: presidio:50051
  redaction_ttl_ms: 300000

telemetry:
  enabled: true
  otlp_endpoint: http://localhost:4318
  log_level: info
  service_name: nexus-llm-gateway

database:
  # url non impostato qui: viene sempre sovrascritto da DATABASE_URL / POSTGRES_URL (env).
  # In Docker l'env usa "postgres:5432", in WSL locale "localhost:5433".
  pool_size: 20
  ssl: false

redis:
  url: redis://redis:6379

features:
  allow_cloud_tier2: true
  # Profilo cloud/dev: l'operatore E' il proprietario dei dati e ha richiesto
  # accesso completo. Coerente con l'intento gia' documentato sul blocco
  # routing.tier_3 ("Dev locale: cloud abilitato per tier 3, scelta esplicita
  # operatore"). La redaction reidratabile (redaction.enabled=true) sanitizza
  # comunque i segreti prima dell'invio al provider. In PROD usare hybrid/onprem
  # (che mantengono allow_cloud_tier3=false). Override runtime: settings
  # dlp_allow_cloud_tier3 (regola G).
  allow_cloud_tier3: true
  dlp_enabled: true

# Provider routing policy — matrice tier -> chain provider (vedi header del
# file per gate DLP, semantica pin e codici errore). Riepilogo del profilo
# cloud: TUTTI i tier ammettono i provider cloud (allow_cloud_tier2/3=true,
# scelta esplicita dell'operatore dev; in prod usare hybrid/onprem).
routing:
  tier_0:
    primary: openai
    secondary: deepseek
    tertiary: google
    fallback: mistral
  tier_1:
    primary: openai
    secondary: deepseek
    tertiary: google
    fallback: mistral
  tier_2:
    # Dev locale: cloud abilitato per tier 2 (features.allow_cloud_tier2=true).
    # In sviluppo i contenuti "sensibili" sono menzioni in spec (es. email
    # d'esempio), non dati reali di clienti. In prod usare profilo hybrid/onprem.
    primary: openai
    secondary: deepseek
    tertiary: google
    fallback: mistral
  tier_3:
    # Dev locale: cloud abilitato per tier 3 (scelta esplicita operatore).
    # In prod usare profilo hybrid/onprem con provider on-premise.
    primary: anthropic
    secondary: openai
    tertiary: google
    fallback: deepseek

# Gestione database e migrazioni per i progetti utente importati in Nexus.
# Queste policy si applicano ai DB dei progetti (NON al DB interno di Nexus).
project_database:
  # Se true, ogni modifica schema deve passare dal migration runner.
  require_migration_for_ddl: true
  # Se true, l'utente può disabilitare il guardrail con conferma UI.
  allow_override: true
  # Il bypass richiede sempre una conferma esplicita nell'interfaccia utente.
  override_requires_ui_confirm: true
  # Ogni DDL (diretto o via migration) viene tracciato in project_migration_history.
  audit_all_ddl: true
  # Motore DB di default quando non rilevato dal detector.
  default_engine: postgres
  # V1: solo PostgreSQL supportato come motore gestito internamente.
  supported_engines:
    - postgres
  # Tool di migrazione supportati; gli altri vengono rilevati ma non gestiti attivamente.
  supported_migration_tools:
    - alembic
    - prisma
    - sqlx
    - flyway
    - django
    - rails
    - knex
    - liquibase
    - generic-sql
