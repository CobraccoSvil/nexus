# Aggiungere QUESTO SNIPPET alla configurazione nginx su macchina 103
# File: /etc/nginx/sites-available/nexus o /etc/nginx/conf.d/nexus.conf

# IMPORTANTE: Questo deve essere dentro il server block per nexus.cobracco.it

server {
    listen 80;
    listen 443 ssl http2;
    server_name nexus.cobracco.it;

    # SSL certificates (already configured)
    # ssl_certificate ...
    # ssl_certificate_key ...

    # ============================================================
    # NUOVA REGOLA: Forward dei static files Next.js
    # ============================================================
    location /_next/static/ {
        proxy_pass http://localhost:3000/_next/static/;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache headers per static assets
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";

        # Buffering per file grossi
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ============================================================
    # NUOVA REGOLA: Forward di tutti gli altri _next resources
    # ============================================================
    location /_next/ {
        proxy_pass http://localhost:3000/_next/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Non cachare questi
        proxy_no_cache 1;
    }

    # ============================================================
    # REGOLA ESISTENTE: nexus endpoint (già funzionante)
    # ============================================================
    location /nexus/ {
        proxy_pass http://localhost:3000/nexus/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # FALLBACK: Forward tutto il resto a 101:3000
    # ============================================================
    location / {
        proxy_pass http://localhost:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
