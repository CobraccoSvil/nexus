[workspace]
members = [
  "crates/mcp-core",
  "crates/mcp-token",
  "crates/mcp-ast",
  "crates/mcp-quality",
  "crates/mcp-db",
  "crates/mcp-comments",
  "crates/mcp-learning",
  "crates/mcp-proto",
  "crates/nexus-auth",
  "crates/nexus-types",
  "crates/nexus-cache",
  "crates/admin-service",
  "crates/billing-service",
  "crates/doc-service",
  "crates/chat-service",
  "crates/plugin-service"
, "crates/nexus-orchestrator", "crates/ruvector", "crates/nexus-http", "crates/xtask", "crates/browser-bridge-mcp", "crates/nexus-events", "crates/nexus-sudo-runner", "crates/nexus-mcp-client"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Cobracco S.r.l."]

# Profili build (bonifica dev-loop 2026-06-11). Portabili (versionati): il
# guadagno e' nel rebuild incrementale del dev-loop locale, senza toccare la
# correttezza ne il profilo release di produzione.
[profile.dev]
# Debuginfo minimale: solo tabelle di riga (basta per backtrace/panic con
# numero di riga). Genera e LINKA molto meno DWARF -> link incrementale piu'
# rapido. I debugger step-by-step perdono qualcosa, raro nel dev-loop di Nexus.
debug = "line-tables-only"
# DWARF fuori dagli oggetti .o: il linker non deve copiarlo dentro il binario
# (su Linux/WSL e' il default piu' rapido per ricompilazioni frequenti).
split-debuginfo = "unpacked"

# Le dipendenze esterne in dev: compilarle con un minimo di ottimizzazione le
# rende piu' veloci a runtime (es. sqlx/regex/serde) senza rallentare il
# rebuild del NOSTRO codice (le dep si compilano una volta sola e si cachano).
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws", "http2", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
prost = "0.13"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.53", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.44", features = ["full"] }
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
base64 = "0.22"
dashmap = "5"
nexus-http = { path = "crates/nexus-http" }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
notify = { version = "6", features = ["serde"] }

[workspace.dependencies.tonic-build]
version = "0.12"

# Lint policy del workspace (post-rimozione del --cap-lints globale,
# bonifica 2026-06-11). I lint di CORRETTEZZA restano attivi e bloccanti
# via verify.sh (-D warnings); qui si silenziano SOLO le classi stilistiche
# del backlog storico, tracciate in docs/tech-debt-rust.md. Niente nuovi
# allow senza motivazione scritta.
[workspace.lints.clippy]
too_many_arguments = "allow"          # 16 firme storiche; refactor invasivo, backlog
type_complexity = "allow"             # 9 tipi axum/tuple storici, backlog
doc_overindented_list_items = "allow" # 38 doc-comment storici, solo formattazione
doc_lazy_continuation = "allow"       # liste numerate nei doc-comment, solo rendering
empty_line_after_doc_comments = "allow" # 5 casi, solo formattazione
