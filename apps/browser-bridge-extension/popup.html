<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Nexus Browser Bridge</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(255,255,255,.06);
        --border: rgba(255,255,255,.10);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.65);
        --accent: #7c3aed;
        --accent2: rgba(124,58,237,.18);
        --ok: #22c55e;
        --err: #ef4444;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 340px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: radial-gradient(900px 420px at 15% 5%, rgba(124,58,237,.25), transparent 55%),
                    radial-gradient(700px 340px at 95% 10%, rgba(34,197,94,.10), transparent 55%),
                    var(--bg);
        padding: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-weight: 900;
        font-size: 18px;
        color: white;
        box-shadow: 0 10px 24px rgba(124,58,237,.28);
      }
      .title { font-weight: 800; font-size: 14px; line-height: 1.1; }
      .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      label { display: block; margin: 0 0 4px; font-weight: 650; color: var(--muted); font-size: 12px; }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.06);
        color: var(--text);
        border-radius: 10px;
        font-family: var(--mono);
        outline: none;
      }
      input:focus {
        border-color: rgba(124,58,237,.65);
        box-shadow: 0 0 0 3px rgba(124,58,237,.22);
      }

      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      button {
        cursor: pointer;
        border-radius: 10px;
        padding: 9px 10px;
        border: 1px solid rgba(124,58,237,.65);
        background: rgba(124,58,237,.18);
        color: white;
        font-weight: 750;
        font-size: 12px;
        transition: transform .06s ease, opacity .12s ease, background .12s ease;
      }
      button:hover { background: rgba(124,58,237,.28); }
      button:active { transform: translateY(1px); }
      button.secondary {
        border-color: var(--border);
        background: rgba(255,255,255,.06);
        color: var(--text);
        font-weight: 650;
      }
      button.secondary:hover { background: rgba(255,255,255,.10); }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.06);
        color: var(--muted);
        line-height: 1.3;
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(148,163,184,.8); }
      .status.ok { color: rgba(34,197,94,.95); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10); }
      .status.ok .dot { background: var(--ok); }
      .status.err { color: rgba(239,68,68,.95); border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); }
      .status.err .dot { background: var(--err); }

      .hint { color: var(--muted); font-size: 11px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">N</div>
      <div>
        <div class="title">Nexus Browser Bridge</div>
        <div class="subtitle">Connessione al daemon locale e attach del tab</div>
      </div>
    </div>

    <div class="card">
      <div>
        <label for="port">Porta daemon</label>
        <input id="port" type="number" value="4055" min="1" max="65535" />
      </div>

      <div>
        <label for="token">Token (file <span style="font-family: var(--mono);">~/.ideai/browser-bridge.token</span>)</label>
        <input id="token" type="text" placeholder="Incolla il token qui" />
      </div>

      <div class="row">
        <button id="save">Salva e riconnetti</button>
        <button id="attach" class="secondary">Attach tab corrente</button>
        <button id="detach" class="secondary">Detach</button>
        <button id="refresh" class="secondary">Verifica</button>
      </div>

      <div id="status" class="status"><span class="dot"></span><span>In attesa…</span></div>
      <div class="hint">
        Suggerimento: se il daemon risulta “non raggiungibile”, avvialo da Nexus (stack dev) e verifica che sia in ascolto su 127.0.0.1.
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
