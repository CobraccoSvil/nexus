[package]
name = "ruvector"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Workspace deps
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# RuVector specific
# hnsw_rs = "0.3"                   # HNSW algorithm (optional - we implement custom)
ordered-float = "4.0"               # Deterministic float ordering
# rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid"] }  # SQLite (Phase 3)
parking_lot = "0.12"                # Fast Mutex/RwLock
dashmap.workspace = true            # Concurrent HashMap
thiserror = "1.0"                   # Error handling
rand = "0.8"                        # Random number generation

# Optional: ONNX for embeddings (can be added later)
# ort = { version = "1.16", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tokio-test = "0.4"

[lints]
workspace = true
