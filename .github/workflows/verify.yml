name: Verify

# Budget Actions: su account Free un repo privato ha 2000 minuti/mese, e questo
# job ne costa 10-25 per esecuzione. I push su `feature/**` non lo attivano piu':
# chi vuole il gate prima del merge apre la pull request, che lo esegue comunque.
# Cosi' un branch di lavoro con dieci commit costa un run invece di dieci.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    # `cargo test --workspace` (dentro pnpm verify) include test #[sqlx::test]
    # (model_selection, orchestrator, allocate_port, agent_run) che creano DB
    # temporanei: servono un Postgres e DATABASE_URL, come nel job lint-test-build
    # di ci.yml. Senza, quei test falliscono e il job verify resta rosso.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      # Il runner parte da zero e muore a fine job: la cache incrementale non
      # verrebbe MAI riusata, ma verrebbe scritta lo stesso. Stesso motivo (e
      # stesse misure) di scripts/gate-env.sh, che i gate locali sorgono; qui
      # va ripetuto perche' un workflow YAML non puo' sorgere uno script shell.
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      # La versione la dichiara .nvmrc (punto unico, regola L), non questo file.
      #
      # Qui c'era `node-version: "20"`, scritto a mano dal 2026-06-15. Il
      # 2026-07-03 i test della web-ide sono diventati file .ts eseguiti da
      # `node --test` con un glob: Node 20 non fa ne' il type-stripping ne'
      # l'espansione del glob, e da quel giorno il gate e' morto SEMPRE nella
      # prima fase — clippy e nextest non sono mai stati eseguiti. Il locale
      # girava su Node 24 e nessuno dei due posti dichiarava la differenza.
      #
      # Con node-version-file la CI usa la stessa versione del locale per
      # costruzione. Il MINIMO tollerato sta in package.json (`engines.node`) e
      # lo pretende `gate_pretende_node`: se un giorno questa riga tornasse a
      # una versione insufficiente, il gate si fermerebbe dichiarando la causa
      # (uscita 78) invece di accusare il codice TypeScript.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        # v4 (runtime Node 20): le @v2 usavano Node 16, dismesso da GitHub ->
        # hard-fail del job all'avvio. La versione pnpm e' letta da package.json
        # "packageManager" (pnpm@10.7.0): NON aggiungere `version:` o v4 aborta
        # con "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      # Toolchain pinnata in rust-toolchain.toml (channel + componenti clippy,
      # rustfmt) = unica fonte di verita'. rustup legge l'override file e
      # installa il canale con i suoi componenti; il workflow NON duplica la
      # versione. Cosi' il gate clippy (-D warnings) e' deterministico: un bump
      # di stable non arrossa piu' `main` da solo. `cargo clippy --version`
      # forza l'install e stampa la versione effettiva nei log per audit.
      - name: Setup Rust toolchain (da rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo clippy --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Esecutore dei test del gate (scripts/verify.sh). Va installato QUI e non
      # lasciato a un `cargo install` dentro il gate: quello ricompilerebbe
      # nextest a ogni run, ed e' lo stesso costo per cui `cargo install
      # sqlx-cli` e' stato tolto da questo workflow. L'action scarica il binario
      # precompilato.
      #
      # Se manca, verify.sh si FERMA con un messaggio esplicito invece di
      # ripiegare su `cargo test`: locale e CI devono misurare la stessa cosa.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Il Postgres del service e' vuoto: i test che girano su schema reale
      # (`#[sqlx::test(migrator = ...)]`) hanno bisogno del set applicato.
      #
      # Si usa il COMANDO DEL REPO, non sqlx-cli. Prima qui c'era
      # `cargo install sqlx-cli --locked` + `sqlx migrate run`: "lo stesso
      # motore della produzione" era vero per CONVENZIONE — quel --locked
      # pinnava il lockfile di sqlx-cli, non lo sqlx del workspace, quindi i due
      # potevano divergere a un aggiornamento senza che nessuno se ne
      # accorgesse. Ora e' vero per COSTRUZIONE: `xtask migrate` delega a
      # `nexus-migrations`, lo stesso codice che mcp-core esegue all'avvio.
      # In piu' sparisce un `cargo install` da ogni run.
      - name: Apply DB migrations
        run: cargo run --locked -p xtask -- migrate --set meta --apply

      # LA SEQUENZA DI BOOTSTRAP, ESEGUITA invece che descritta.
      #
      # Su un database vergine esisteva un ciclo: il catalogo dei servizi arriva
      # dalle migrazioni; le migrazioni le applicava solo mcp-core all'avvio;
      # per avviarlo come servizio serve il suo manifest; il manifest si genera
      # leggendo il catalogo. Lo step precedente ha appena applicato il set
      # SENZA avviare alcun servizio, e questo dimostra che il catalogo e' li' e
      # il piano dei manifest e' producibile.
      #
      # E' l'unica prova che il ciclo resti rotto nel tempo: una nota in un
      # documento non fallisce quando qualcuno reintroduce la dipendenza.
      - name: Bootstrap eseguibile (il ciclo catalogo/manifest e' rotto)
        run: cargo run --locked -p xtask -- service-manifests --dry-run

      # Il crate mcp-proto usa prost-build, che richiede il compilatore protobuf
      # `protoc` a build time. Senza, `cargo check/clippy/test` (dentro pnpm
      # verify) fallisce subito con "Could not find protoc". ci.yml non ne ha
      # bisogno perche' non compila Rust.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # In CI il gate NON si ferma alla prima fase rossa: prosegue e riporta
      # tutte le fasi rotte, piu' l'elenco di quelle che non ha eseguito.
      # Discriminante: la variabile CI (vedi FAIL_FAST in scripts/verify.sh).
      - name: Run pnpm verify
        run: pnpm verify

      # `!cancelled()` sugli step INDIPENDENTI da qui in poi, e per la stessa
      # ragione per cui il gate non e' piu' fail-fast in CI: un rosso in
      # `pnpm verify` non deve nascondere lo stato di build, guard e ratchet.
      # Fermarsi al primo fa sapere che qualcosa e' rotto, mai quante cose lo
      # sono — e finche' e' stato cosi', tutto cio' che veniva dopo la prima
      # fase e' rimasto non misurato per settimane.
      #
      # Restano fail-fast gli step PRECEDENTI (install, migrazioni, protoc):
      # quelle sono premesse, e senza di esse cio' che segue non misura niente.
      #
      # Il build di produzione era l'unica verifica esclusiva di ci.yml, che per
      # il resto rifaceva lint/typecheck/test gia' compresi in `pnpm verify`
      # (turbo run typecheck lint test). Assorbito qui, ci.yml e' stato rimosso:
      # due job su ogni push costavano 25 minuti per ~20 di lavoro utile.
      - name: Build produzione (ex ci.yml)
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Guard punti unici (regola L)
        if: ${{ !cancelled() }}
        run: bash scripts/check-single-source.sh

      # Il gate ratchet jscpd NON e' piu' uno step a se': dal 2026-08-05 e' una
      # fase di `pnpm verify`, e ora che quel gate in CI le esegue tutte,
      # rieseguirlo qui costerebbe 19s per rimisurare l'identico albero.

      - name: Gate ratchet marker (debito + inerzia)
        if: ${{ !cancelled() }}
        run: bash scripts/markers-ratchet.sh

      - name: Lint commits (xtask)
        if: ${{ !cancelled() }}
        run: pnpm xtask lint-commits origin/main HEAD || true
