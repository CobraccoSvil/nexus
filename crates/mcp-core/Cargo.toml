[package]
name = "mcp-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
dotenvy.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
nexus-http.workspace = true
sha2.workspace = true
rand.workspace = true
urlencoding.workspace = true
base64.workspace = true
mcp-token = { path = "../mcp-token" }
mcp-ast = { path = "../mcp-ast" }
mcp-quality = { path = "../mcp-quality" }
mcp-db = { path = "../mcp-db" }
mcp-proto = { path = "../mcp-proto" }
nexus-auth = { path = "../nexus-auth" }
nexus-mcp-client = { path = "../nexus-mcp-client" }
nexus-types = { path = "../nexus-types" }
nexus-cache = { path = "../nexus-cache" }
nexus-project-db = { path = "../nexus-project-db" }
nexus-build-graph = { path = "../nexus-build-graph" }
nexus-tool-kit = { path = "../nexus-tool-kit" }
nexus-orchestrator = { path = "../nexus-orchestrator" }
nexus-events = { path = "../nexus-events" }
parking_lot = "0.12"
ruvector = { path = "../ruvector" }
dashmap.workspace = true
futures.workspace = true
regex.workspace = true
tokio-stream.workspace = true
notify.workspace = true
thiserror = "1.0"
async-trait = "0.1"
once_cell = "1.20"
tiberius = { version = "0.12", features = ["rustls", "tds73"], default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
# Ingestion intelligente allegati (ADR 0011): magic byte detection + parser
# archivi/documenti. Usati dai tool nexus_inspect_attachment,
# nexus_list_archive_entries, nexus_extract_pdf_text, ecc.
infer = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
pdf-extract = "0.7"
quick-xml = "0.36"
# LRU cache per deduplica letture allegati (read_cache, vedi ADR 0012).
# 256 entry, TTL 5 min configurabile via setting agent.attachment.read_cache_ttl_seconds.
lru = "0.12"
# ADR 0020 — Build graph resolver:
# - toml: parsing Cargo.toml workspace e pyproject.toml
# - json5: parsing tsconfig.json tollerante a commenti e trailing commas
# - globset: compilazione include/exclude glob in regex set per lookup O(log n)
toml = { version = "0.8", features = ["parse"] }
json5 = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
# default: include onnx — l'ambiente locale canonico (WSL, regola "Esecuzione
# locale canonica") ha AVX2 e il modello in models/minilm/. Il fallback a
# HashEmbedder resta come rete di sicurezza se i file modello mancano.
default = ["onnx"]
# onnx: abilita OnnxMiniLmEmbedder (384-dim) in nexus-orchestrator per semantic tool search
# Richiede CPU con AVX2 per libonnxruntime (Haswell e successivi) a runtime.
onnx = ["nexus-orchestrator/onnx"]

# libc: usata in sandbox.rs::build_sandboxed_command per leggere uid/gid
# del processo host (cosi' i container Docker non scrivono file root-owned
# sui volumi bind-mount, evitando il bug "delete_project lascia dir orfana").
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
