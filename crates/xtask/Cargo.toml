[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mcp-quality = { path = "../mcp-quality" }
# audit-settings A1 (DB live): connessione sqlx diretta a DATABASE_URL invece di
# `docker exec psql` (regola G: config dal DB, niente hardcode infrastruttura).
# tokio: runtime current-thread effimero per la singola query async.
sqlx = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }
# battery-explain: la REGOLA dell'eleggibilita' non si ricopia, si chiede al crate
# da cui mcp-core compone il claim (regola L/O). nexus-auth: punto unico della
# lettura settings, per dichiarare la premessa del giro con la stessa API del worker.
nexus-model-eligibility = { path = "../nexus-model-eligibility" }
nexus-auth = { path = "../nexus-auth" }

[lints]
workspace = true
