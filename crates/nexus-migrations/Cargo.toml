[package]
name = "nexus-migrations"
edition.workspace = true
version.workspace = true

# Punto unico dell'APPLICAZIONE dei set di migrazioni (regola L). E' una
# dipendenza di PRODUZIONE (mcp-core la usa all'avvio), quindi resta minimale:
# niente `sqlx::migrate!`, niente include_str! dei file. Il gemello
# compile-time vive in `nexus-migrations-embedded`, che e' solo dev-dependency
# e dipende da questo.
[dependencies]
# sha2 serve solo a COSTRUIRE la variante a fine-riga opposti di cui provare
# l'hash (src/registro.rs): l'hash canonico non lo calcola mai questo crate, lo
# prende da sqlx, che e' quello che il migrator confrontera'. La dipendenza e'
# gia' nel grafo — sqlx la usa per gli stessi checksum — quindi il crate resta
# minimale come dichiarato sopra.
sha2.workspace = true
sqlx.workspace = true
thiserror = "1.0"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[lints]
workspace = true
