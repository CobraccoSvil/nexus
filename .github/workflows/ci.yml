name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        # v4 (runtime Node 20): le @v2 usavano Node 16, dismesso da GitHub ->
        # hard-fail del job all'avvio. La versione pnpm e' letta da package.json
        # "packageManager" (pnpm@10.7.0): NON aggiungere `version:` o v4 aborta
        # con "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        # `pnpm test` -> `turbo run test`; i package usano gia' `vitest run`
        # (esecuzione singola). NON aggiungere `--run`: turbo lo interpreta come
        # proprio argomento sconosciuto e fallisce ("unexpected argument --run").
        run: pnpm test
        env:
          POSTGRES_URL: postgres://nexus:nexus@localhost:5432/nexus
          REDIS_URL: redis://localhost:6379

      - name: Health check
        run: |
          echo "CI pipeline completed successfully"
