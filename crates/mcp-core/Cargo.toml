nexus-events = { path = "../nexus-events" }
nexus-graph = { path = "../nexus-graph" }
nexus-agent-graph = { path = "../nexus-agent-graph" }
parking_lot = "0.12"
ruvector = { path = "../ruvector" }
dashmap.workspace = true
futures.workspace = true
regex.workspace = true
tokio-stream.workspace = true
notify.workspace = true
portable-pty.workspace = true
thiserror = "1.0"
async-trait = "0.1"
once_cell = "1.20"
tiberius = { version = "0.12", features = ["rustls", "tds73"], default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
# Estrazione ZIP per visual_compare/figma_tools; gli altri parser allegati
# (infer/tar/flate2/pdf-extract/quick-xml) sono migrati in nexus-agent-tools
# con i tool di ingestion (ADR 0011, split 7.4 fase C).
zip = { version = "2", default-features = false, features = ["deflate"] }
# ADR 0020 — Build graph resolver:
# - toml: parsing Cargo.toml workspace e pyproject.toml
# - json5: parsing tsconfig.json tollerante a commenti e trailing commas
# - globset: compilazione include/exclude glob in regex set per lookup O(log n)
toml = { version = "0.8", features = ["parse"] }
json5 = "0.4"
globset = "0.4"
# File rc temporaneo della guard bash del terminale WebSocket (project_workspace/terminal_ws.rs).
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[features]
# default: include onnx — l'ambiente locale canonico (WSL, regola "Esecuzione
# locale canonica") ha AVX2 e il modello in models/minilm/. Il fallback a
# HashEmbedder resta come rete di sicurezza se i file modello mancano.
default = ["onnx"]
# onnx: abilita OnnxMiniLmEmbedder (384-dim) in nexus-orchestrator per semantic tool search
# Richiede CPU con AVX2 per libonnxruntime (Haswell e successivi) a runtime.
onnx = ["nexus-orchestrator/onnx"]

# tokio-console: apre il server di diagnostica del runtime (porta 6669) per
# ispezionare le task vive con la CLI `tokio-console`. Serve a una domanda sola,
# che nessun altro strumento risponde: QUALE task non viene pollata.
#
# Non e' attiva per default e non deve esserlo: la strumentazione ha un costo per
# ogni task creata, e la build richiede comunque `--cfg tokio_unstable`, che
# invalida la cache di compilazione. Vedi il commento in `init_infrastructure`
# per il comando esatto.
#
# Prima di ricorrere a questa: `runtime_health` (sentinella del ritardo di
# risveglio) e i WARN `sqlx::pool::acquire` sono gia' nei log e costano zero.
tokio-console = ["dep:console-subscriber"]

# libc: usata in sandbox.rs::build_sandboxed_command per leggere uid/gid
# del processo host (cosi' i container Docker non scrivono file root-owned
# sui volumi bind-mount, evitando il bug "delete_project lascia dir orfana").
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# windows-sys: liveness di processo + metriche OS cross-platform in
# process_util.rs. Su Linux la liveness/metriche usano /proc, qui no dep.
# - Win32_System_Threading: OpenProcess, GetProcessTimes, GetProcessIoCounters,
#   IO_COUNTERS (metriche CPU/IO del processo servizio).
# - Win32_System_ProcessStatus: K32GetProcessMemoryInfo, PROCESS_MEMORY_COUNTERS
#   (WorkingSetSize -> RSS del processo servizio).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[lints]
workspace = true
